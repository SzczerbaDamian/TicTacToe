name: Hand Guard APK

on:
  push:
    paths:
      - "hand-guard/**"
      - ".github/workflows/hand-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hand-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HandGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HandGuard-apk
          path: hand-guard/HandGuard.apk

      # Direct APK download from the phone: GitHub -> Releases -> "Hand Guard (latest)".
      - name: Publish to the "hand-guard-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hand-guard-latest >/dev/null 2>&1 || \
            gh release create hand-guard-latest --title "Hand (latest)" --prerelease \
              --target "$GITHUB_SHA" --notes "Newest build of Hand. Download HandGuard.apk."
          gh release upload hand-guard-latest HandGuard.apk --clobber
